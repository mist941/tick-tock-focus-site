<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sorry to see you go — TickTockFocus</title>
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/assets/icon-16.png" sizes="16x16" type="image/png">
    <link rel="stylesheet" href="/assets/styles.css">
    <style>
      .uninstall {
        max-width: var(--width-text);
        margin: 0 auto;
        padding: var(--space-section) var(--page-gutter);
        text-align: center;
      }
      .uninstall-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto var(--space-large);
      }
      .uninstall .button-group {
        justify-content: center;
        margin-top: var(--space-extra-large);
      }
      .uninstall-reinstall {
        margin-top: var(--space-large);
      }
    </style>
  </head>
  <body>
    <main class="uninstall">
      <img class="uninstall-icon" src="/assets/icon-512.png" alt="" width="72" height="72">
      <h1>Sorry to see you go</h1>
      <p>Thanks for trying TickTockFocus. If something didn't work or was missing, a one-line note helps make the next version better.</p>
      <div class="button-group">
        <a class="button button-primary" href="mailto:support@ticktockfocus.com?subject=Uninstall%20feedback">Tell us what went wrong</a>
        <a class="button button-secondary" href="https://github.com/mist941/tick-tock-focus/issues">Report a bug</a>
      </div>
      <p class="uninstall-reinstall">Removed it by accident? <a href="https://chromewebstore.google.com/detail/nealkefeifpkmkbfcfbkffdgnlohjbae">Reinstall from the Chrome Web Store</a>.</p>
    </main>
  </body>
</html>
